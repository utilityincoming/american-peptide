<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AmericanPeptide">
  <!-- Maskable variant of the brand mark. Full-bleed OPAQUE background (no rounded
       corners — the OS draws its own mask) and the molecule scaled into the inner
       80% safe zone so Android's circle/squircle/teardrop crop never touches it.
       Same glyph + palette as favicon.svg. Regenerate PNGs after editing:
       node scripts/generate-icons.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16201C"/>
      <stop offset="1" stop-color="#070B09"/>
    </linearGradient>
    <radialGradient id="node" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#C7E9D8"/>
      <stop offset="45%" stop-color="#7EE0B5"/>
      <stop offset="100%" stop-color="#1E6B52"/>
    </radialGradient>
    <linearGradient id="bond" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7EE0B5"/>
      <stop offset="1" stop-color="#D2FBE6"/>
    </linearGradient>
  </defs>

  <!-- Full square, no corner radius: let the platform apply its own mask. -->
  <rect width="32" height="32" fill="url(#bg)"/>

  <!-- Scale the molecule about the centre so it lives inside the 40%-radius safe circle. -->
  <g transform="translate(16,16) scale(0.8) translate(-16,-16)">
    <polyline points="9,21 16,11 23,21" fill="none"
              stroke="url(#bond)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="9"  cy="21" r="4.1" fill="url(#node)"/>
    <circle cx="16" cy="11" r="4.6" fill="url(#node)"/>
    <circle cx="23" cy="21" r="4.1" fill="url(#node)"/>

    <g fill="#ffffff" fill-opacity="0.55">
      <circle cx="7.4"  cy="19.4" r="1.2"/>
      <circle cx="14.3" cy="9.4"  r="1.3"/>
      <circle cx="21.4" cy="19.4" r="1.2"/>
    </g>
  </g>
</svg>
