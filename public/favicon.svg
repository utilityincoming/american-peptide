<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AmericanPeptide">
  <!-- Canonical brand mark: a three-residue peptide molecule, matching the hero
       molecule's visual language. Same geometry as the flat glyph in
       src/components/BrandMark.tsx, in the site token palette.
       Regenerate the PNG icons after editing: node scripts/generate-icons.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <radialGradient id="node" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#b6f8e9"/>
      <stop offset="45%" stop-color="#2DD4A8"/>
      <stop offset="100%" stop-color="#0c6f59"/>
    </radialGradient>
    <linearGradient id="bond" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4A8"/>
      <stop offset="1" stop-color="#5EEBC8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <polyline points="9,21 16,11 23,21" fill="none"
            stroke="url(#bond)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="9"  cy="21" r="4.1" fill="url(#node)"/>
  <circle cx="16" cy="11" r="4.6" fill="url(#node)"/>
  <circle cx="23" cy="21" r="4.1" fill="url(#node)"/>

  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="7.4"  cy="19.4" r="1.2"/>
    <circle cx="14.3" cy="9.4"  r="1.3"/>
    <circle cx="21.4" cy="19.4" r="1.2"/>
  </g>
</svg>
