<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="AmericanPeptide">
  <!-- Canonical brand mark. Same two-arc glyph as src/components/BrandMark.tsx,
       in the site token palette (surface #0B1220 / panel #0F1828 / accent #2DD4A8).
       Dark-chip / teal-glyph here; the header inverts it (teal chip / dark glyph).
       Regenerate the PNG icons after editing: node scripts/generate-icons.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1828"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5" fill="url(#bg)"/>
  <g fill="none" stroke="#2DD4A8" stroke-width="2.2" stroke-linecap="round">
    <path d="M4 5c4.5 0 7.5 4 7.5 7S15.5 19 20 19"/>
    <path d="M20 5c-4.5 0-7.5 4-7.5 7S8.5 19 4 19"/>
  </g>
</svg>
